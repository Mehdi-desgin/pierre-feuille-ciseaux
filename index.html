<!DOCTYPE html>
<html lang="fr">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Pierre Feuille Ciseaux</title>
  <style>
    :root {
      --bg: #ffffff;
      --text: #111111;
      --border: #dddddd;
      --button-bg: #f9f9f9;
      --button-hover: #eeeeee;
    }

    [data-theme="dark"] {
      --bg: #1e1e1e;
      --text: #f0f0f0;
      --border: #444444;
      --button-bg: #2c2c2c;
      --button-hover: #3a3a3a;
    }

    body {
      font-family: sans-serif;
      max-width: 500px;
      margin: 60px auto;
      text-align: center;
      background: var(--bg);
      color: var(--text);
    }

    select, button {
      background: var(--button-bg);
      color: var(--text);
      border: 1px solid var(--border);
    }

    .choices {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin: 30px 0;
    }

    .choiceBtn {
      font-size: 40px;
      padding: 16px 20px;
      cursor: pointer;
      border: 2px solid var(--border);
      border-radius: 12px;
      background: var(--button-bg);
      box-shadow: 0 6px 0 var(--border), 0 8px 10px rgba(0, 0, 0, 0.25);
      transform: translateY(0);
      transition: transform 0.1s, box-shadow 0.1s;
    }

    .choiceBtn:hover {
      background: var(--button-hover);
    }

    .choiceBtn:active {
      transform: translateY(4px);
      box-shadow: 0 2px 0 var(--border), 0 3px 6px rgba(0, 0, 0, 0.25);
    }

    .choiceBtn:disabled {
      box-shadow: 0 3px 0 var(--border), 0 4px 6px rgba(0, 0, 0, 0.15);
    }

    #result {
      font-size: 22px;
      font-weight: bold;
      min-height: 30px;
      margin: 20px 0;
    }

    #roundDetail {
      font-size: 16px;
      color: #666;
      min-height: 20px;
    }

    #score {
      display: flex;
      justify-content: center;
      gap: 30px;
      font-size: 16px;
      margin-top: 20px;
    }

    #resetBtn {
      margin-top: 20px;
      padding: 8px 16px;
      font-size: 14px;
      cursor: pointer;
    }

    #roundCounter {
      font-size: 14px;
      color: #666;
    }

    #finalResult {
      font-size: 24px;
      font-weight: bold;
      margin-top: 10px;
      min-height: 30px;
    }

    .choiceBtn:disabled {
      opacity: 0.4;
      cursor: not-allowed;
    }

    #history {
      list-style: none;
      padding: 0;
      margin-top: 20px;
      text-align: left;
      font-size: 14px;
    }

    #history li {
      padding: 6px 0;
      border-bottom: 1px solid var(--border);
      display: flex;
      justify-content: space-between;
    }

    #globalStats {
      margin-top: 24px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      text-align: left;
    }

    #globalStats h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }

    #playerNameInput {
      padding: 6px;
      font-size: 14px;
      margin: 10px 0;
    }

    #leaderboard {
      margin-top: 24px;
      padding: 12px;
      border: 1px solid var(--border);
      border-radius: 8px;
      font-size: 14px;
      text-align: left;
    }

    #leaderboard h3 {
      margin: 0 0 8px 0;
      font-size: 15px;
    }

    #leaderboard ol {
      margin: 0;
      padding-left: 20px;
    }

    #leaderboard li {
      padding: 3px 0;
    }

    #leaderboard li.topRank {
      font-weight: bold;
      font-size: 16px;
      padding: 6px 0;
    }
  </style>
</head>
<body>
  <h1>Pierre Feuille Ciseaux</h1>

  <button id="themeToggle">🌙 Mode sombre</button>

  <div>
    <label for="playerNameInput">Pseudo : </label>
    <input type="text" id="playerNameInput" placeholder="Votre pseudo">
  </div>

  <label for="lengthSelect">Longueur de la partie : </label>
  <select id="lengthSelect">
    <option value="3">Meilleur des 3</option>
    <option value="5" selected>Meilleur des 5</option>
    <option value="7">Meilleur des 7</option>
  </select>

  <p id="roundCounter">Manche 1/5</p>

  <div class="choices">
    <button class="choiceBtn" data-choice="pierre">🪨</button>
    <button class="choiceBtn" data-choice="feuille">📄</button>
    <button class="choiceBtn" data-choice="ciseaux">✂️</button>
  </div>

  <div id="result"></div>
  <div id="roundDetail"></div>

  <div id="score">
    <span id="winsCount">Victoires : 0</span>
    <span id="lossesCount">Défaites : 0</span>
    <span id="tiesCount">Égalités : 0</span>
  </div>

  <div id="finalResult"></div>

  <button id="resetBtn">Nouvelle partie</button>

  <ul id="history"></ul>

  <div id="globalStats"></div>

  <button id="resetStatsBtn">Réinitialiser les stats globales</button>

  <div id="leaderboard"></div>

  <script src="script.js"></script>
  <script type="module" src="leaderboard.js"></script>
</body>
</html>
